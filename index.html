<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskflow | Modern Task Manager</title>
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --font-family: 'Plus Jakarta Sans', sans-serif;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(255, 255, 255, 0.07);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --danger: #f43f5e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: var(--font-family);
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Background Animated Orbs */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
    }
    .circle-1 {
      width: 300px;
      height: 300px;
      background: #c084fc;
      top: 10%;
      left: 15%;
      opacity: 0.3;
    }
    .circle-2 {
      width: 350px;
      height: 350px;
      background: #6366f1;
      bottom: 10%;
      right: 15%;
      opacity: 0.35;
    }

    /* Glassmorphic Card */
    .app-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    .app-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .app-header p {
      color: var(--text-sub);
      font-size: 0.875rem;
      margin-top: 4px;
      margin-bottom: 1.5rem;
    }

    /* Input Form */
    .input-wrapper {
      display: flex;
      gap: 0.5rem;
      background: rgba(0, 0, 0, 0.2);
      padding: 6px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 1.25rem;
    }

    .input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 0.6rem 0.8rem;
      color: #fff;
      font-size: 0.95rem;
    }

    .input-wrapper input::placeholder {
      color: #64748b;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.6rem 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    /* Filter Tabs */
    .filter-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.15);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 1rem;
    }

    .tab {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-sub);
      padding: 0.4rem;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab.active {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-weight: 600;
    }

    /* Task List */
    .task-list {
      list-style: none;
      max-height: 280px;
      overflow-y: auto;
      margin-bottom: 1rem;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .task-item label {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
      font-size: 0.95rem;
      color: #e2e8f0;
    }

    .task-item input[type="checkbox"] {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .task-item.completed span {
      text-decoration: line-through;
      color: #64748b;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0 4px;
      transition: color 0.2s;
    }

    .delete-btn:hover {
      color: var(--danger);
    }

    /* Footer */
    .app-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.75rem;
      border-top: 1px solid var(--card-border);
    }

    .badge {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .btn-text {
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 0.8rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .btn-text:hover {
      color: var(--danger);
    }
  </style>
</head>
<body>

  <div class="bg-shape circle-1"></div>
  <div class="bg-shape circle-2"></div>

  <main class="app-card">
    <header class="app-header">
      <div class="title-area">
        <h1>Taskflow ✨</h1>
        <p>Keep track of your daily goals</p>
      </div>
    </header>

    <form id="taskForm" class="input-wrapper">
      <input 
        type="text" 
        id="taskInput" 
        placeholder="Add a new task..." 
        required 
        autocomplete="off"
      >
      <button type="submit" class="btn-primary">
        <span>Add</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </form>

    <nav class="filter-tabs">
      <button class="tab active" data-filter="all">All</button>
      <button class="tab" data-filter="pending">Pending</button>
      <button class="tab" data-filter="completed">Completed</button>
    </nav>

    <ul id="taskList" class="task-list"></ul>

    <footer class="app-footer">
      <span id="taskCount" class="badge">0 items left</span>
      <button id="clearCompletedBtn" class="btn-text">Clear completed</button>
    </footer>
  </main>

  <script>
    let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
    let currentFilter = 'all';

    const taskForm = document.getElementById('taskForm');
    const taskInput = document.getElementById('taskInput');
    const taskList = document.getElementById('taskList');
    const taskCount = document.getElementById('taskCount');
    const clearCompletedBtn = document.getElementById('clearCompletedBtn');
    const filterTabs = document.querySelectorAll('.tab');

    function saveTasks() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function render() {
      taskList.innerHTML = '';

      const filteredTasks = tasks.filter(task => {
        if (currentFilter === 'pending') return !task.completed;
        if (currentFilter === 'completed') return task.completed;
        return true;
      });

      if (filteredTasks.length === 0) {
        taskList.innerHTML = `<li style="text-align:center; padding: 1rem; color: #64748b; font-size: 0.85rem;">No tasks found</li>`;
      }

      filteredTasks.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        
        li.innerHTML = `
          <label>
            <input type="checkbox" ${task.completed ? 'checked' : ''}>
            <span>${task.text}</span>
          </label>
          <button class="delete-btn">&times;</button>
        `;

        li.querySelector('input').addEventListener('change', () => {
          task.completed = !task.completed;
          saveTasks();
          render();
        });

        li.querySelector('.delete-btn').addEventListener('click', () => {
          tasks = tasks.filter(t => t.id !== task.id);
          saveTasks();
          render();
        });

        taskList.appendChild(li);
      });

      const remaining = tasks.filter(t => !t.completed).length;
      taskCount.textContent = `${remaining} ${remaining === 1 ? 'item' : 'items'} left`;
    }

    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = taskInput.value.trim();
      if (!text) return;

      tasks.push({ id: Date.now(), text, completed: false });
      taskInput.value = '';
      saveTasks();
      render();
    });

    filterTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        filterTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.filter;
        render();
      });
    });

    clearCompletedBtn.addEventListener('click', () => {
      tasks = tasks.filter(t => !t.completed);
      saveTasks();
      render();
    });

    render();
  </script>
</body>
</html>
