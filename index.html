<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .todo-container {
            background: #ffffff;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }

        button {
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #218838;
        }

        ul {
            list-style: none;
        }

        li {
            background: #f9f9f9;
            padding: 10px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        li.completed span {
            text-decoration: line-through;
            color: #888;
        }

        .delete-btn {
            background-color: #dc3545;
            padding: 5px 10px;
            font-size: 12px;
        }

        .delete-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

    <div class="todo-container">
        <h2>To-Do List</h2>
        <div class="input-box">
            <input type="text" id="taskInput" placeholder="নতুন কাজ লিখুন...">
            <button onclick="addTask()">যোগ করুন</button>
        </div>
        <ul id="taskList"></ul>
    </div>

    <script>
        function addTask() {
            const input = document.getElementById("taskInput");
            const taskText = input.value.trim();

            if (taskText === "") {
                alert("দয়া করে একটি কাজ লিখুন!");
                return;
            }

            const ul = document.getElementById("taskList");
            const li = document.createElement("li");

            const span = document.createElement("span");
            span.textContent = taskText;
            span.onclick = function () {
                li.classList.toggle("completed");
            };

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "ডিলিট";
            deleteBtn.className = "delete-btn";
            deleteBtn.onclick = function () {
                ul.removeChild(li);
            };

            li.appendChild(span);
            li.appendChild(deleteBtn);
            ul.appendChild(li);

            input.value = "";
        }
    </script>
</body>
</html>
