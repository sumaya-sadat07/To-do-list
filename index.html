<!-- HTML Example -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do List</title>
</head>
<body>
  <h1>My To-Do List</h1>
  
  <div class="input-container">
    <input type="text" id="taskInput" placeholder="Add a new task...">
    <button id="addBtn">Add Task</button>
  </div>

  <ul id="taskList"></ul>
</body>
</html>
